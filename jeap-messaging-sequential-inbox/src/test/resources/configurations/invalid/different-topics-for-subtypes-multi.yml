subTypeResolvers:
  MyEventType1: ch.admin.bit.jeap.messaging.sequentialinbox.configuration.model.TestSubTypeResolver

sequences:

  - name: eventType2AfterEventType1
    retentionPeriod: P2D
    messages:
      - type: MyEventType1
        subType: BANANAS
        topics:
          - topic-1
          - topic-1-v2
        contextIdExtractor: ch.admin.bit.jeap.messaging.sequentialinbox.configuration.model.TestContextIdExtractor

      - type: MyEventType1
        subType: APPLES
        # only one of the two topics configured here, which is inconsistent with the previous message
        topics:
          - topic-1
        contextIdExtractor: ch.admin.bit.jeap.messaging.sequentialinbox.configuration.model.TestContextIdExtractor
